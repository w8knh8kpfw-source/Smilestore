name: Keep SmileStore awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Render service
        run: |
          curl --fail --silent --show-error \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 45 \
            https://smilestorewebservice.onrender.com/ 
