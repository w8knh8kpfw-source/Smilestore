name: Keep SmileStore awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smilestore-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake and verify Render service
        run: |
          for attempt in 1 2 3; do
            echo "SmileStore check $attempt"
            if curl --fail --silent --show-error --max-time 50 https://smilestorewebservice.onrender.com/; then
              echo "SmileStore responded successfully"
              exit 0
            fi
            sleep 5
          done
          echo "SmileStore did not respond after 3 attempts"
          exit 1
