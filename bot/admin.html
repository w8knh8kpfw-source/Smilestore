<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a33"><title>SmileStore Admin</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07182e;--panel:#102b4b;--panel2:#0d2440;--line:#294766;--blue:#438fda;--text:#eff6ff;--muted:#9db2cc;--green:#46c69a;--red:#ef7180}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#16416b 0,transparent 40%),linear-gradient(160deg,#06162a,#0b2340 60%,#071a32);color:var(--text);font:14px 'DM Sans',sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:850px;margin:auto;padding:22px 18px 42px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font:800 21px Manrope;letter-spacing:-1px}.brand span{color:#83c1ff}.sub{color:var(--muted);font-size:12px;margin-top:4px}.live{border:1px solid #28634f;color:#75e0b8;background:#123c37;padding:7px 10px;border-radius:30px;font-size:11px}.hero{position:relative;overflow:hidden;padding:26px;border:1px solid #315578;background:linear-gradient(135deg,#163c63dd,#0d2848dd);border-radius:18px;box-shadow:0 18px 50px #0003,inset 0 1px #ffffff12;margin-bottom:20px}.eyebrow{color:#83c1ff;font-size:10px;letter-spacing:1.7px;font-weight:700}.hero h1{font:800 27px/1.1 Manrope;margin:10px 0 8px;letter-spacing:-.8px}.hero p{margin:0;color:#b1c4db;font-size:13px;max-width:390px;line-height:1.55}.hero:after{content:'✦';position:absolute;right:25px;top:20px;font-size:92px;color:#8bc8ff18;transform:rotate(15deg)}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.quick button{display:flex;align-items:center;gap:10px;text-align:left;padding:14px;background:linear-gradient(145deg,#15385c,#102844);border:1px solid #315577;border-radius:14px;color:#eaf4ff}.quick .qicon{width:38px;height:38px;display:grid;place-items:center;background:#28639a;border-radius:11px;font-size:19px}.quick small{display:block;color:#9db7d1;font-size:10px;margin-top:3px}.catalog-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}.catalog-head small{color:var(--muted);font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 22px}.stat{position:relative;overflow:hidden;padding:15px;background:#102b4b;border:1px solid var(--line);border-radius:14px}.stat b{font:700 24px Manrope;display:block}.stat span{color:var(--muted);font-size:11px}.stat:after{content:'';position:absolute;width:44px;height:44px;border-radius:50%;background:#4d9de51a;right:-12px;bottom:-14px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 13px}.section-head h2{font:700 18px Manrope;margin:0}.primary,.secondary,.danger{border:0;border-radius:10px;padding:11px 14px;font-weight:700}.primary{background:linear-gradient(135deg,#4599e5,#2165a7);color:white;box-shadow:0 8px 20px #0003}.secondary{background:#193b5e;color:#dcecff;border:1px solid #355b7d}.danger{background:#542b3b;color:#ffb8c1}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:5px;margin-bottom:14px}.chip{white-space:nowrap;border:1px solid #34516e;background:#102b4b;color:#afc4dd;padding:8px 12px;border-radius:30px;font-size:11px}.chip.active{background:#2769a7;color:white;border-color:#69a9e4}.search{width:100%;background:#0c2340;border:1px solid #2c4b6a;border-radius:10px;padding:12px 14px;color:white;outline:none;margin-bottom:14px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;padding:10px;background:linear-gradient(140deg,#123253,#0d2745);border:1px solid #294866;border-radius:14px}.thumb{width:62px;height:62px;border-radius:10px;background:#1c3c5d;object-fit:cover;flex:none}.info{min-width:0;flex:1}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:11px;margin-top:5px}.price{color:#cfe7ff;font-weight:700;margin-top:5px;font-size:12px}.status{display:inline-block;padding:4px 7px;border-radius:20px;background:#174637;color:#8be0bd;font-size:10px;margin-top:6px}.status.preorder{background:#4a3b1c;color:#f2d18b}.status.unavailable{background:#4c2633;color:#ffb3bf}.edit{background:#1c4268;border:1px solid #3d668d;color:#dcecff;border-radius:9px;padding:9px 11px}.empty{text-align:center;padding:38px 12px;color:var(--muted);border:1px dashed #35516e;border-radius:14px}.modal{display:none;position:fixed;inset:0;background:#020b17c9;backdrop-filter:blur(10px);z-index:10;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.dialog{width:min(560px,100%);max-height:92dvh;overflow:auto;background:#102b4b;border:1px solid #416284;border-radius:20px;padding:20px;box-shadow:0 25px 90px #0009}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dialog h3{font:700 19px Manrope;margin:0}.x{border:0;background:#1c4268;color:white;border-radius:9px;width:34px;height:34px;font-size:20px}.field{margin:13px 0}.field label{display:block;color:#b9cce1;font-size:11px;margin-bottom:7px}.field input:not([type=file]),.field textarea,.field select{width:100%;border:1px solid #345573;background:#0a203a;border-radius:10px;padding:12px;color:#f1f7ff;outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#72b5f2}.field label.upload{display:flex;margin:0;position:relative;display:flex;align-items:center;gap:13px;padding:16px;border:1px dashed #5b83aa;background:linear-gradient(135deg,#153a60,#0c2440);border-radius:14px;min-height:84px;cursor:pointer;overflow:hidden}.upload .upicon{width:42px;height:42px;display:grid;place-items:center;background:#27649d;border-radius:12px;font-size:21px;flex:none}.upload b{display:block;font-size:13px}.upload small{display:block;color:#a9c0d8;font-size:11px;margin-top:5px}.upload input{position:absolute!important;inset:0;width:100%!important;height:100%!important;opacity:0!important;cursor:pointer;padding:0!important;z-index:2}.preview{width:100%;height:180px;object-fit:contain;background:#0a203a;border:1px dashed #426383;border-radius:12px;margin-top:8px;display:none}.actions{display:flex;gap:9px;margin-top:18px}.dialog{padding:22px}.field{margin:16px 0}.actions button{flex:1}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:#eaf4ff;color:#102b4b;padding:12px 17px;border-radius:12px;font-weight:700;opacity:0;transition:.2s;z-index:30;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{opacity:.55;pointer-events:none}@media(max-width:390px){.app{padding-left:13px;padding-right:13px}.hero{padding:20px}.hero h1{font-size:24px}.stat{padding:12px 10px}.stat b{font-size:21px}.quick{gap:8px}.quick button{padding:11px 9px}.quick .qicon{width:34px;height:34px}}@media(min-width:650px){.modal{align-items:center}.stats{gap:14px}.item{padding:13px}.thumb{width:70px;height:70px}} 
</style></head><body><main class="app" id="app"><header class="top"><div><div class="brand"><span>smile</span>store <small style="font-size:10px;color:#91a9c4;letter-spacing:1px">ADMIN</small></div><div class="sub">Панель управления магазином</div></div><div class="live">● ONLINE</div></header><section class="hero"><div class="eyebrow">УПРАВЛЕНИЕ КАТАЛОГОМ</div><h1>Всё под контролем.</h1><p>Добавляй товары, обновляй цены и наличие в несколько касаний.</p></section><section class="stats"><div class="stat"><b id="total">—</b><span>Всего товаров</span></div><div class="stat"><b id="available">—</b><span>В наличии</span></div><div class="stat"><b id="preorder">—</b><span>Предзаказ</span></div></section><div class="quick"><button id="quickAdd"><span class="qicon">＋</span><span><b>Новый товар</b><small>Добавить в каталог</small></span></button><button id="quickRefresh"><span class="qicon">↻</span><span><b>Обновить</b><small>Синхронизировать данные</small></span></button></div><div class="catalog-head"><div><h2 style="font:700 18px Manrope;margin:0">Каталог товаров</h2><small id="catalogCount">Все товары магазина</small></div><button class="primary" id="add">＋ Добавить</button></div><nav class="filters" id="filters"><button class="chip active" data-cat="all">Все</button><button class="chip" data-cat="brush">Щётки</button><button class="chip" data-cat="paste">Пасты</button><button class="chip" data-cat="floss">Зубная нить</button><button class="chip" data-cat="mouthwash">Ополаскиватели</button><button class="chip" data-cat="irrigator">Ирригаторы</button><button class="chip" data-cat="care">Уход</button></nav><input class="search" id="search" placeholder="⌕  Найти товар..."><div class="list" id="list"><div class="empty">Загружаем каталог…</div></div></main>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h3 id="modalTitle">Новый товар</h3><button class="x" id="close">×</button></div><form id="form"><div class="field"><label>ФОТО ТОВАРА</label><label class="upload" for="photo"><span class="upicon">＋</span><span><b id="uploadTitle">Выбрать фотографию</b><small id="uploadHint">Нажми один раз · JPG, PNG или WEBP · до 8 МБ</small></span><input type="file" id="photo" accept="image/*"></label><img class="preview" id="preview"></div><div class="field"><label>НАЗВАНИЕ</label><input id="name" required maxlength="100" placeholder="Например, щётка Oral-B"></div><div class="field"><label>КАТЕГОРИЯ</label><select id="category" required><option value="brush">Щётки</option><option value="paste">Пасты</option><option value="floss">Зубная нить</option><option value="mouthwash">Ополаскиватели</option><option value="irrigator">Ирригаторы</option><option value="care">Дополнительный уход</option></select></div><div class="field"><label>ОПИСАНИЕ</label><textarea id="description" maxlength="500" placeholder="Краткое описание товара"></textarea></div><div class="field"><label>ЦЕНА, СОМOНИ</label><input id="price" type="number" min="0" step="0.01" required placeholder="189"></div><div class="field"><label>НАЛИЧИЕ</label><select id="status"><option value="available">В наличии</option><option value="preorder">Предзаказ</option><option value="unavailable">Нет в наличии</option></select></div><div class="actions"><button type="submit" class="primary" id="save">Сохранить товар</button><button type="button" class="danger" id="delete" style="display:none">Удалить</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';const launchToken=new URLSearchParams(location.search).get('launch_token')||'';let products=[],active='all',editing=null,photoData=null;
const cats={brush:'Щётки',paste:'Пасты',floss:'Зубная нить',mouthwash:'Ополаскиватели',irrigator:'Ирригаторы',care:'Дополнительный уход'},statuses={available:'В наличии',preorder:'Предзаказ',unavailable:'Нет в наличии'};
const $=id=>document.getElementById(id);function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'content-type':'application/json','x-telegram-init-data':initData,'x-smilestore-launch-token':launchToken},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json().catch(()=>({error:'Ошибка сервера'}));if(!r.ok)throw Error(j.error||'Ошибка запроса');return j}
function stats(){ $('total').textContent=products.length;$('available').textContent=products.filter(p=>p.status==='available').length;$('preorder').textContent=products.filter(p=>p.status==='preorder').length}
function render(){stats();$('catalogCount').textContent=products.length+' товаров в магазине';const q=$('search').value.toLowerCase().trim();const rows=products.filter(p=>(active==='all'||p.category===active)&&(p.name||'').toLowerCase().includes(q));$('list').innerHTML='';if(!rows.length){$('list').innerHTML='<div class="empty">Товары не найдены</div>';return}rows.forEach(p=>{const row=document.createElement('article');row.className='item';const img=document.createElement('img');img.className='thumb';img.src=p.image_url||'';img.alt='';const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=p.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=cats[p.category]||cats.care;const price=document.createElement('div');price.className='price';price.textContent=Number(p.price||0)+' сомони';const st=document.createElement('span');st.className='status '+(p.status==='available'?'':p.status);st.textContent=statuses[p.status]||'В наличии';info.append(name,meta,price,st);const btn=document.createElement('button');btn.className='edit';btn.textContent='Изменить';btn.onclick=()=>openEdit(p);row.append(img,info,btn);$('list').append(row)})}
async function load(){try{products=await api('/api/admin/products');render()}catch(e){toast(e.message);$('list').innerHTML='<div class="empty">Не удалось загрузить каталог. Открой мини-приложение из Telegram.</div>'}}
function openNew(){editing=null;photoData=null;$('form').reset();$('uploadTitle').textContent='Выбрать фотографию';$('uploadHint').textContent='Нажми один раз · JPG, PNG или WEBP · до 8 МБ';$('modalTitle').textContent='Новый товар';$('delete').style.display='none';$('preview').style.display='none';$('save').textContent='Добавить товар';$('modal').classList.add('open')}
function openEdit(p){editing=p;photoData=null;$('form').reset();$('uploadTitle').textContent='Заменить фотографию';$('uploadHint').textContent='Или оставь текущее фото без изменений';$('name').value=p.name||'';$('category').value=p.category||'care';$('description').value=p.description||'';$('price').value=p.price||'';$('status').value=p.status||'available';$('modalTitle').textContent='Редактировать товар';$('delete').style.display='block';$('save').textContent='Сохранить изменения';$('preview').src=p.image_url||'';$('preview').style.display=p.image_url?'block':'none';$('modal').classList.add('open')}
function close(){ $('modal').classList.remove('open') }
$('add').onclick=openNew;$('quickAdd').onclick=openNew;$('quickRefresh').onclick=()=>{toast('Обновляем каталог…');load()};$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('search').oninput=render;$('filters').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;active=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()};
$('photo').addEventListener('change',async()=>{const f=$('photo').files&&$('photo').files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Выбери изображение из галереи');$('photo').value='';return}if(f.size>16*1024*1024){toast('Фото должно быть меньше 16 МБ');$('photo').value='';return}$('uploadTitle').textContent='Обрабатываем фото…';$('uploadHint').textContent=f.name;try{if(['image/jpeg','image/png','image/webp'].includes(f.type)){photoData=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(new Error('read'));rd.readAsDataURL(f)})}else{photoData=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(f);const img=new Image();img.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.88))}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('format'))};img.src=url})}if(photoData.length>12*1024*1024)throw new Error('size');$('uploadTitle').textContent='Фото выбрано ✓';$('uploadHint').textContent=f.name+' · готово к загрузке';$('preview').src=photoData;$('preview').style.display='block'}catch(e){photoData=null;$('uploadTitle').textContent='Выбрать фотографию';$('uploadHint').textContent='Не удалось обработать фото. Попробуй JPG или PNG.';toast('Не удалось обработать это фото. Попробуй другое.')}});
$('form').onsubmit=async e=>{e.preventDefault();const btn=$('save');btn.disabled=true;btn.textContent='Сохраняем…';try{let image_url=editing?.image_url||'';if(photoData){const up=await api('/api/admin/upload','POST',{image:photoData});image_url=up.url}const data={name:$('name').value.trim(),category:$('category').value,description:$('description').value.trim(),price:Number($('price').value),status:$('status').value,...(image_url?{image_url}:{})};if(editing)await api('/api/admin/products/'+editing.id,'PATCH',data);else await api('/api/admin/products','POST',data);toast(editing?'Изменения сохранены':'Товар добавлен');close();await load()}catch(err){toast(err.message)}finally{btn.disabled=false;btn.textContent=editing?'Сохранить изменения':'Добавить товар'}};
$('delete').onclick=async()=>{if(!editing||!confirm('Удалить этот товар?'))return;try{await api('/api/admin/products/'+editing.id,'DELETE');toast('Товар удалён');close();await load()}catch(e){toast(e.message)}};
if(!initData&&!launchToken){$('list').innerHTML='<div class="empty">Откройте панель кнопкой «Админ-панель» в меню Telegram-бота.</div>'}else load();
</script></body></html>
